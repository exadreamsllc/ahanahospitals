<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Ahana Hospitals</title>
  <style>
    body {
      background-color: #0b0813;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      color: #8b5cf6;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 30px;
    }
    .btn {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      transition: all 0.3s ease;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You are currently offline</h1>
  <p>Some features might be unavailable. Connect to the internet or wait for network restoration to load live clinical database records.</p>
  <button onclick="window.location.reload()" class="btn">Retry Connection</button>
</body>
</html>
